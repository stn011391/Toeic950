name: Validate and Deploy TOEIC950

on:
  push:
    branches: ["main", "agent/v1.4.0"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for f in data*.js app*.js; do node --check "$f"; done
      - name: Data smoke test
        run: node tests/data-smoke.js
      - name: UI contract test
        run: node tests/app-contract.js
      - name: Backup smoke test
        run: node tests/backup-smoke.js
      - name: Five-round family diversity test
        run: node tests/repeat-smoke.js

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
