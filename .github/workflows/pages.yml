name: Validate and Deploy TOEIC950

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for f in data*.js app*.js; do node --check "$f"; done
      - name: Data smoke test
        run: node tests/data-smoke.js
      - name: UI contract test
        run: node tests/app-contract.js
      - name: Backup smoke test
        run: node tests/backup-smoke.js
      - name: Five-round structural diversity test
        run: node tests/repeat-smoke.js
      - name: Five-round human repetition audit
        run: node tests/human-repeat-audit.js

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed v1.5.0
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}?verify=${{ github.sha }}"
          for attempt in {1..12}; do
            if curl -fsSL "$url" | grep -Fq 'v1.5.0 · Similarity Shield'; then
              echo 'PASS live Pages: v1.5.0 · Similarity Shield'
              exit 0
            fi
            sleep 5
          done
          echo 'FAIL live Pages did not expose v1.5.0 · Similarity Shield'
          exit 1
